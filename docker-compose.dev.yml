version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: caffeineco-db-dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - caffeineco-network-dev

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-final
    container_name: caffeineco-api-dev
    depends_on:
      - mongodb
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/caffeine_co?authSource=admin
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
    networks:
      - caffeineco-network-dev
    restart: on-failure
    command: bash -c "npm install && node index.js"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: caffeineco-web-dev
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - caffeineco-network-dev
    stdin_open: true
    tty: true

volumes:
  mongodb_data_dev:

networks:
  caffeineco-network-dev:
    driver: bridge
