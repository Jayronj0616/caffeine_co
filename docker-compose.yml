version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: caffeineco-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: caffeine_co
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caffeineco-network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: caffeineco-phpmyadmin
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - caffeineco-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-final
    container_name: caffeineco-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: caffeine_co
      DB_DIALECT: mysql
      DB_PORT: 3306
    ports:
      - "5000:5000"
    networks:
      - caffeineco-network
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
    command: npm run dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/menu', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: caffeineco-web
    ports:
      - "5173:3000"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_API_PROXY_TARGET: http://backend:5000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - caffeineco-network
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  mysql_data:

networks:
  caffeineco-network:
    driver: bridge
